services:
  # Next.js Application (API + UI)
  metalab-app:
    build: .
    image: metalab:latest
    container_name: metalab-app
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - metalab-data:/app/storage
      - metalab-db:/app/db.sqlite
    command: npm start
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/accounts"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker Process (Job Executor)
  metalab-worker:
    image: metalab:latest
    container_name: metalab-worker
    env_file: .env
    volumes:
      - metalab-data:/app/storage
      - metalab-db:/app/db.sqlite
    command: npx tsx worker/index.ts
    restart: unless-stopped
    depends_on:
      metalab-app:
        condition: service_started

  # Database Migration (one-shot)
  metalab-migrate:
    image: metalab:latest
    container_name: metalab-migrate
    env_file: .env
    profiles:
      - migrate
    volumes:
      - metalab-data:/app/storage
      - metalab-db:/app/db.sqlite
    command: >
      sh -c "npm run migrate 2>/dev/null && echo 'Migrations complete' || echo 'No pending migrations'"
    restart: no

  # MinIO (Self-hosted S3-compatible storage)
  # Enable with: docker compose --profile minio up -d
  minio:
    image: minio/minio
    container_name: metalab-minio
    profiles:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: metalab-nginx
    profiles:
      - nginx
    volumes:
      - ./nginx.conf.template:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      metalab-app:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  metalab-data:
  metalab-db:
  minio-data:
